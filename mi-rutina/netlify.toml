[build]
  publish = "."
  command = "npm run build"
  functions = "netlify/functions"

[functions."send-reminders"]
  schedule = "*/15 * * * *"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
